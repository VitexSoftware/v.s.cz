<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <style>
      .quad { transition: opacity 0.2s; }
      .quad:hover { opacity: 0.9; }
    </style>
  </defs>

  <!-- Top-left: Admin (Blue) -->
  <rect x="0" y="0" width="128" height="128" fill="#2563eb" class="quad"/>
  <g transform="translate(64, 64)">
    <circle r="20" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
    <g stroke="white" stroke-width="2" fill="none" opacity="0.7">
      <line x1="0" y1="-28" x2="0" y2="-32"/>
      <line x1="0" y1="28" x2="0" y2="32"/>
      <line x1="28" y1="0" x2="32" y2="0"/>
      <line x1="-28" y1="0" x2="-32" y2="0"/>
    </g>
  </g>

  <!-- Top-right: Catalog (Green) -->
  <rect x="128" y="0" width="128" height="128" fill="#16a34a" class="quad"/>
  <g transform="translate(192, 64)">
    <g stroke="white" stroke-width="3" fill="none" opacity="0.7">
      <rect x="-18" y="-20" width="36" height="8" rx="2"/>
      <rect x="-18" y="-6" width="36" height="8" rx="2"/>
      <rect x="-18" y="8" width="36" height="8" rx="2"/>
      <rect x="-18" y="22" width="36" height="8" rx="2"/>
    </g>
  </g>

  <!-- Bottom-left: Vault (Purple) -->
  <rect x="0" y="128" width="128" height="128" fill="#9333ea" class="quad"/>
  <g transform="translate(64, 192)">
    <g stroke="white" stroke-width="3" fill="none" opacity="0.7">
      <rect x="-16" y="-8" width="32" height="24" rx="2"/>
      <path d="M -12 -8 Q -12 -18 0 -18 Q 12 -18 12 -8" fill="none"/>
      <circle r="4" cx="0" cy="4"/>
    </g>
  </g>

  <!-- Bottom-right: Registry + Proxy (Teal/Orange blend) -->
  <defs>
    <linearGradient id="registryProxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="128" y="128" width="128" height="128" fill="url(#registryProxy)" class="quad"/>
  <g transform="translate(192, 192)">
    <g stroke="white" stroke-width="2.5" fill="white" opacity="0.8">
      <circle r="5" cx="-10" cy="-10"/>
      <circle r="5" cx="10" cy="-10"/>
      <circle r="5" cx="0" cy="10"/>
      <line x1="-10" y1="-5" x2="0" y2="5" stroke="white" fill="none" stroke-width="2.5"/>
      <line x1="10" y1="-5" x2="0" y2="5" stroke="white" fill="none" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Center overlay: MCP in white circle -->
  <circle cx="128" cy="128" r="48" fill="white" opacity="0.95"/>
  <text x="128" y="138" font-family="sans-serif" font-size="32" font-weight="bold" 
        fill="#1f2937" text-anchor="middle">MCP</text>

  <!-- Border -->
  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#e5e7eb" stroke-width="2"/>
</svg>
